version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: semantic-bi-backend
    restart: unless-stopped
    environment:
      - BACKEND_PORT=5001
      - FLASK_ENV=production
      - DATASOURCE_TYPE=${DATASOURCE_TYPE:-currentLocal}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30}
      - FENGSHEN_BI_BASE_URL=${FENGSHEN_BI_BASE_URL:-}
      - FENGSHEN_BI_APP_ID=${FENGSHEN_BI_APP_ID:-}
      - FENGSHEN_BI_APP_SECRET=${FENGSHEN_BI_APP_SECRET:-}
      - FENGSHEN_BI_TOKEN=${FENGSHEN_BI_TOKEN:-}
      - FENGSHEN_BI_WORKSPACE_ID=${FENGSHEN_BI_WORKSPACE_ID:-}
    volumes:
      - ./data:/app/data
    expose:
      - "5001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: semantic-bi-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

# 用法：
#   1. cp .env.example .env 并按需修改
#   2. docker compose -f docker-compose.prod.yml up -d --build
#   3. 浏览器访问 http://服务器IP
